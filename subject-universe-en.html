<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Universe of Knowledge</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#0b0820;--ink:#f4f1ff;--mut:#a9a3d6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 20%,#2a1a6b 0%,var(--bg) 60%);color:var(--ink);font-family:"Noto Sans Malayalam","Manjari","Segoe UI",system-ui,sans-serif;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(1.5px 1.5px at 70% 60%,#fff9,transparent),radial-gradient(2px 2px at 40% 80%,#fff7,transparent),radial-gradient(1.5px 1.5px at 85% 15%,#fff8,transparent),radial-gradient(1px 1px at 10% 70%,#fff9,transparent);background-size:300px 300px;animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.4}to{opacity:1}}
header{text-align:center;padding:22px 16px 0;position:relative}
h1{margin:0;font-size:clamp(26px,6vw,44px);line-height:1.2;background:linear-gradient(90deg,#ffd36e,#ff7eb6,#7ee8fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:6px 0 0;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.hub{position:relative;width:min(94vw,640px);aspect-ratio:1;margin:8px auto 0}
.ring{position:absolute;inset:12%;border:1.5px dashed #ffffff30;border-radius:50%;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.core{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:clamp(11px,2.6vw,15px);line-height:1.3;background:radial-gradient(circle,#ffd36e,#ff7eb6 60%,#7a3cff);color:#1a0f40;font-weight:700;box-shadow:0 0 50px #ff7eb680;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 90px #ff7eb6cc;transform:translate(-50%,-50%) scale(1.05)}}
.node{position:absolute;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:inherit;font-size:clamp(9px,2.2vw,13px);font-weight:600;background:radial-gradient(circle at 30% 25%,#fff7,var(--c) 55%,#0006);box-shadow:0 0 22px var(--c);transition:transform .25s,box-shadow .25s;animation:bob 4s ease-in-out infinite}
.node:nth-child(odd){animation-delay:-2s}
@keyframes bob{50%{margin-top:-6px}}
.node .e{font-size:clamp(18px,5vw,30px)}
.node:hover,.node:focus-visible{transform:translate(-50%,-50%) scale(1.18);box-shadow:0 0 44px var(--c);outline:none}
.node.done::after{content:"✓";position:absolute;top:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:#3ddc97;color:#06281a;font-size:12px;display:grid;place-items:center}
.prog{text-align:center;color:var(--mut);font-size:14px;padding:6px 16px 28px}
.bar{width:min(80vw,320px);height:8px;border-radius:8px;background:#ffffff1f;margin:8px auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd36e,#ff7eb6);transition:width .5s}
.panel{position:fixed;inset:0;z-index:5;display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:radial-gradient(ellipse at 50% 0%,var(--c) -60%,#0b0820 65%)}
.panel.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:scale(.94)}}
.card{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:1px solid #ffffff40;background:#ffffff14;color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{background:#ffffff2a}
.big{font-size:84px;text-align:center;margin:18px 0 0;filter:drop-shadow(0 0 24px var(--c))}
.card h2{text-align:center;margin:4px 0 0;font-size:32px}
.card .en{text-align:center;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin:2px 0 14px}
.fact{background:#ffffff12;border-left:4px solid var(--c);border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.6}
.q{margin-top:16px;font-size:17px;font-weight:600}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{text-align:left;border:2px solid #ffffff30;background:#ffffff0d;color:var(--ink);border-radius:14px;padding:13px 16px;font:inherit;font-size:16px;cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--c)}
.opt.ok{border-color:#3ddc97;background:#3ddc9730}
.opt.no{border-color:#ff5c7a;background:#ff5c7a30}
.msg{min-height:26px;margin-top:10px;font-weight:600;text-align:center}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
</style>
</head>
<body>
<div class="stars"></div>
<header>
  <h1>Universe of Knowledge</h1>
  <p class="sub">Tap a planet to explore</p>
</header>
<div class="hub" id="hub"><div class="ring"></div><div class="core">Pick a<br>planet ✨</div></div>
<div class="prog"><span id="pt">0 / 11 explored</span><div class="bar"><i id="pb"></i></div></div>

<div class="panel" id="panel"><div class="card">
  <div class="top"><button class="btn" id="back">← Universe</button><span id="idx" style="color:var(--mut)"></span></div>
  <div class="big" id="pe"></div>
  <h2 id="pm"></h2><div class="en" id="pn"></div>
  <div class="fact" id="pf"></div>
  <div class="q" id="pq"></div>
  <div class="opts" id="po"></div>
  <div class="msg" id="pg"></div>
  <div class="nav"><button class="btn" id="prev">← Previous</button><button class="btn" id="next">Next →</button></div>
</div></div>

<script>
var S=[
{e:"📖",m:"English",n:"Language",c:"#ff7eb6",f:"Shakespeare gave English hundreds of words, including ‘lonely’ and ‘bedroom’.",q:"Which word is a noun?",o:["run","happiness","quickly"],a:1},
{e:"➗",m:"Maths",n:"Numbers",c:"#ffd36e",f:"India played a huge part in developing the idea of zero.",q:"7 × 8 = ?",o:["54","56","58"],a:1},
{e:"🔬",m:"Science",n:"Discovery",c:"#7ee8fa",f:"About 60% of the human body is water.",q:"At what temperature does water boil at sea level?",o:["90 °C","100 °C","120 °C"],a:1},
{e:"🌍",m:"Social Science",n:"People & Places",c:"#5ee0a0",f:"India is the world’s largest democracy.",q:"What is the capital of India?",o:["Mumbai","New Delhi","Kolkata"],a:1},
{e:"💻",m:"ICT",n:"Technology",c:"#6aa8ff",f:"The first computer mouse was made of wood!",q:"What does CPU stand for?",o:["Central Processing Unit","Computer Power Unit","Central Program Utility"],a:0},
{e:"🤖",m:"AI",n:"Artificial Intelligence",c:"#b583ff",f:"AI learns patterns from data, and that is how it appears to ‘think’.",q:"What do AI models mainly learn from?",o:["Data","Magic","Colours"],a:0},
{e:"✍️",m:"Malayalam",n:"Mother Tongue",c:"#ff9a5c",f:"Malayalam received Classical Language status in 2013.",q:"What is the state bird of Kerala?",o:["Peacock","Great Hornbill","Parrot"],a:1},
{e:"🏛️",m:"History",n:"The Past",c:"#d9a066",f:"Cities of the Indus Valley Civilisation even had drainage systems.",q:"In which year did India gain independence?",o:["1942","1947","1950"],a:1},
{e:"🧬",m:"Biology",n:"Life",c:"#6fe36f",f:"Every cell in your body holds about 2 metres of DNA.",q:"How many chambers does a human heart have?",o:["2","4","6"],a:1},
{e:"⚗️",m:"Chemistry",n:"Matter",c:"#ff6b6b",f:"Gold never rusts, which is why it is used in jewellery.",q:"What is the chemical symbol for gold?",o:["Ag","Au","Go"],a:1},
{e:"⚡",m:"Physics",n:"Energy",c:"#ffe14d",f:"Sunlight takes about 8 minutes to reach Earth.",q:"About how fast does light travel?",o:["3,000 km/s","30,000 km/s","300,000 km/s"],a:2}
];
var hub=document.getElementById("hub"),done={},cur=0,$=function(i){return document.getElementById(i)};
S.forEach(function(s,i){
  var ang=(i/S.length)*2*Math.PI-Math.PI/2,b=document.createElement("button");
  b.className="node";b.style.setProperty("--c",s.c);
  b.style.left=(50+39*Math.cos(ang))+"%";b.style.top=(50+39*Math.sin(ang))+"%";
  b.innerHTML='<span class="e">'+s.e+'</span><span>'+s.m+'</span>';
  b.onclick=function(){open_(i)};hub.appendChild(b);s.el=b;
});
function open_(i){
  cur=(i+S.length)%S.length;var s=S[cur],p=$("panel");
  p.style.setProperty("--c",s.c);
  $("pe").textContent=s.e;$("pm").textContent=s.m;$("pn").textContent=s.n;
  $("pf").textContent="💡 "+s.f;$("pq").textContent="🎯 "+s.q;
  $("idx").textContent=(cur+1)+" / "+S.length;$("pg").textContent="";
  var o=$("po");o.innerHTML="";
  s.o.forEach(function(t,k){
    var b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=function(){
      if(o.dataset.l)return;
      if(k===s.a){b.classList.add("ok");$("pg").textContent="Correct! 🎉";o.dataset.l=1;mark();}
      else{b.classList.add("no");$("pg").textContent="Try again 💪";}
    };o.appendChild(b);
  });
  delete o.dataset.l;p.classList.add("on");p.scrollTop=0;
}
function mark(){
  done[cur]=1;S[cur].el.classList.add("done");
  var n=Object.keys(done).length;
  $("pt").textContent=n+" / "+S.length+" explored"+(n===S.length?" 🏆 Well done!":"");
  $("pb").style.width=(n/S.length*100)+"%";
}
$("back").onclick=function(){$("panel").classList.remove("on")};
$("next").onclick=function(){open_(cur+1)};
$("prev").onclick=function(){open_(cur-1)};
</script>
</body>
</html>
